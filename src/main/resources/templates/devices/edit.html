<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Device</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; }
        .container { max-width: 800px; margin: 20px auto; padding: 30px; background: white; border-radius: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-submit { background: #3498db; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-cancel { background: #7f8c8d; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-left: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="header"><h1>✏️ Edit Device</h1></div>
    
    <div class="container">
        <form action="#" th:action="@{/devices/update}" th:object="${device}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group"><label>Serial Number:</label><input type="text" th:field="*{serialNumber}" required/></div>
            <div class="form-group"><label>Device Type:</label><select th:field="*{deviceType}" required><option th:each="type : ${deviceTypes}" th:value="${type}" th:text="${type}"></option></select></div>
            <div class="form-group"><label>Brand:</label><input type="text" th:field="*{brand}" required/></div>
            <div class="form-group"><label>Model:</label><input type="text" th:field="*{model}" required/></div>
            <div class="form-group"><label>Specifications:</label><textarea th:field="*{specifications}" rows="3"></textarea></div>
            <div class="form-group"><label>Condition:</label><select th:field="*{deviceCondition}" required><option th:each="cond : ${conditions}" th:value="${cond}" th:text="${cond}"></option></select></div>
            <div class="form-group"><label>Status:</label><select th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select></div>
            <button type="submit" class="btn-submit">💾 Update Device</button>
            <a href="/devices" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
