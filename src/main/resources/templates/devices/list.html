<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Devices List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; }
        .btn-add { background: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-bottom: 20px; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .btn-edit { background: #3498db; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; margin-right: 5px; }
        .btn-delete { background: #e74c3c; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; }
        .status-available { background: #27ae60; color: white; padding: 3px 8px; border-radius: 3px; }
        .status-assigned { background: #f39c12; color: white; padding: 3px 8px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 Device Management</h1>
        <a href="/" style="color: white; text-decoration: none;">🏠 Back to Dashboard</a>
    </div>
    
    <div class="container">
        <div th:if="${success}" class="success" th:text="${success}"></div>
        <a href="/devices/add" class="btn-add">➕ Add New Device</a>
        
        <table>
            <thead>
                <tr><th>ID</th><th>Serial #</th><th>Type</th><th>Brand</th><th>Model</th><th>Condition</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="device : ${devices}">
                    <td th:text="${device.id}">-</td>
                    <td th:text="${device.serialNumber}">-</td>
                    <td th:text="${device.deviceType}">-</td>
                    <td th:text="${device.brand}">-</td>
                    <td th:text="${device.model}">-</td>
                    <td th:text="${device.deviceCondition}">-</td>
                    <td><span th:class="${device.status == 'Available' ? 'status-available' : 'status-assigned'}" th:text="${device.status}">-</span></td>
                    <td>
                        <a th:href="@{/devices/edit/{id}(id=${device.id})}" class="btn-edit">Edit</a>
                        <a th:href="@{/devices/delete/{id}(id=${device.id})}" class="btn-delete" onclick="return confirm('Delete this device?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
