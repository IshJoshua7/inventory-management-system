<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; }
        .btn-add { background: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-bottom: 20px; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .active { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👥 Employee Management</h1>
        <a href="/" style="color: white; text-decoration: none;">🏠 Back to Dashboard</a>
    </div>
    
    <div class="container">
        <div th:if="${success}" class="success" th:text="${success}"></div>
        <a href="/employees/add" class="btn-add">➕ Add New Employee</a>
        
        <table>
            <thead><tr><th>ID</th><th>Employee ID</th><th>Full Name</th><th>Department</th><th>Position</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead>
            <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}">-</td>
                    <td th:text="${emp.employeeId}">-</td>
                    <td th:text="${emp.fullName}">-</td>
                    <td th:text="${emp.department}">-</td>
                    <td th:text="${emp.position}">-</td>
                    <td th:text="${emp.email}">-</td>
                    <td th:text="${emp.phone}">-</td>
                    <td><span th:class="${emp.active ? 'active' : ''}" th:text="${emp.active ? 'Active' : 'Inactive'}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
