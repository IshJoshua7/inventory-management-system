<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-number { font-size: 36px; font-weight: bold; color: #3498db; }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .chart-bar { background: #3498db; color: white; padding: 5px; margin: 5px 0; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Inventory Reports</h1>
        <a href="/" style="color: white; text-decoration: none;">🏠 Back to Dashboard</a>
    </div>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" th:text="${totalDevices}">0</div><div>Total Devices</div></div>
            <div class="stat-card"><div class="stat-number" th:text="${availableDevices}">0</div><div>Available Devices</div></div>
            <div class="stat-card"><div class="stat-number" th:text="${assignedDevices}">0</div><div>Assigned Devices</div></div>
        </div>
        
        <div class="section">
            <h2>Devices by Type</h2>
            <tr th:each="entry : ${devicesByType}"><td th:text="${entry.key}"></td><td th:text="${entry.value}"></td><td><div class="chart-bar" th:style="'width: ' + (${entry.value} * 100 / ${totalDevices}) + '%;'"><span th:text="${entry.value} + ' devices'"></span></div></td></tr>
        </div>
        
        <div class="section">
            <h2>Devices by Condition</h2>
            <tr th:each="entry : ${devicesByCondition}"><td th:text="${entry.key}"></td><td th:text="${entry.value}"></td></tr>
        </div>
    </div>
</body>
</html>
